[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pergunte-ao-brasileirao"
version = "1.0.0"
description = "Agente LLM (LangGraph + tool calling) que responde perguntas sobre o Brasileirao sem inventar numero"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Joao Santos", email = "jonnygmos@gmail.com" }]
dependencies = [
    # O modelo estatistico (Dixon-Coles + Monte Carlo) vem do outro repositorio,
    # travado num commit: os numeros so mudam se eu mudar este hash (ADR-1).
    "brasileirao @ git+https://github.com/Joaogmos/brasileirao-em-numeros@41e32d74939a43749686f211cbcb698e73145838",
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0"]
app = ["streamlit>=1.50"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]  # padrao de injecao do FastAPI
